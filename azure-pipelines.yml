trigger:
  branches:
    include:
      - main
      - Dev

resources:
  - repo: self

variables:
  vmImageName: 'ubuntu-latest'

  # ARM service connection for App Service deployment
  azureSubscription: 'arm-displify-web-player'

  # App Service details
  appName: 'displify-web-player'
  resourceGroup: 'displify-dev'

  # ACR details
  containerRegistry: 'displify.azurecr.io'
  # Update this value if your ACR Docker service connection has a different name or id.
  dockerRegistryServiceConnection: 'acr-displify'

  # Docker image settings
  imageRepository: 'displify-web-player'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Push Image'
    jobs:
      - job: Build
        displayName: 'Build Docker Image'
        pool:
          vmImage: '$(vmImageName)'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              command: 'buildAndPush'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(Build.SourcesDirectory)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deploy to Azure Web App (Container)'
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/Dev')))
    jobs:
      - deployment: DeployContainer
        displayName: 'Deploy Container Image'
        environment: 'production'
        pool:
          vmImage: '$(vmImageName)'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy container to App Service'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: '$(appName)'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

                - task: AzureCLI@2
                  displayName: 'Resolve App Service hostname'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      HOST_NAME=$(az webapp show --name "$(appName)" --resource-group "$(resourceGroup)" --query defaultHostName -o tsv)
                      if [ -z "$HOST_NAME" ]; then
                        echo "Unable to resolve defaultHostName for $(appName)."
                        exit 1
                      fi
                      echo "Resolved hostname: $HOST_NAME"
                      echo "##vso[task.setvariable variable=resolvedHostName]$HOST_NAME"

                - script: |
                    echo "Waiting 30 seconds for container startup..."
                    sleep 30

                    APP_URL="https://$(resolvedHostName)"
                    ATTEMPT=1
                    MAX_ATTEMPTS=6
                    HTTP_STATUS="000"

                    while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
                      set +e
                      HTTP_STATUS=$(curl -sS -L --max-time 20 -o /dev/null -w "%{http_code}" "${APP_URL}")
                      CURL_EXIT=$?
                      set -e

                      if [ "$CURL_EXIT" -ne 0 ]; then
                        HTTP_STATUS="000"
                      fi

                      echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS} -> HTTP ${HTTP_STATUS}"

                      if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
                        echo "Smoke test PASSED."
                        exit 0
                      fi

                      ATTEMPT=$((ATTEMPT + 1))
                      sleep 15
                    done

                    echo "Smoke test FAILED. Last HTTP status: ${HTTP_STATUS}"
                    exit 1
                  displayName: 'Post-deploy smoke test'
